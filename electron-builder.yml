appId: dev.moss.desktop
productName: Moss
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{docs,.superpowers,e2e,test-results,scripts}/**'
  - '!{playwright,vitest}.config.{ts,mts}'
  - '!assets/**'
asarUnpack:
  - resources/**
win:
  executableName: moss
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
afterPack: build/after-pack.cjs
mac:
  # Hardened runtime needs only allow-jit and allow-unsigned-executable-memory for Electron.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  # Unsigned by default; `npm run dist:mac` overrides both when signing env vars are set.
  identity: null
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Jagannath Mahapatra
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
